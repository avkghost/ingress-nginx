name: Build and publish controller to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: v2.2.10

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/avkghost/ingress-nginx/nginx
  IMAGE: ghcr.io/avkghost/ingress-nginx/controller

jobs:
  publish:
    name: Build, scan, and publish controller image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve image tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Refusing non-release tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build NGINX base image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: docker build --pull=false -t "ingress-nginx/nginx:$TAG" images/nginx/rootfs

      - name: Build controller image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build --pull=false \
            --build-arg BASE_IMAGE="ingress-nginx/nginx:$TAG" \
            --build-arg VERSION="$TAG" \
            --build-arg TARGETARCH=amd64 \
            --build-arg COMMIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_ID="${{ github.run_id }}" \
            -t "$IMAGE:$TAG" rootfs

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Tag and scan NGINX base image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: docker tag "ingress-nginx/nginx:$TAG" "$BASE_IMAGE:$TAG"

      - name: Scan NGINX base image before publishing
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.BASE_IMAGE }}:${{ steps.version.outputs.tag }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Push image
        id: push
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker push "$BASE_IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          base_digest="$(docker image inspect "$BASE_IMAGE:$TAG" --format='{{index .RepoDigests 0}}')"
          digest="$(docker image inspect "$IMAGE:$TAG" --format='{{index .RepoDigests 0}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Published image"
            echo
            echo "Base: \`$base_digest\`"
            echo "\`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
