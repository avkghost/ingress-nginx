name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '00 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  source:
    name: Source and dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Go version
        run: echo "GOLANG_VERSION=$(cat GOLANG_VERSION)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Install source scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go and dependency scanners
        run: make security-scan

  filesystem:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: 0.76.2
          scan-type: fs
          scan-ref: .
          # Dockerfile/Helm misconfiguration is validated by image and chart jobs;
          # this repository gate blocks dependency vulnerabilities and secrets.
          skip-dirs: .modcache
          scanners: vuln,secret
          format: sarif
          output: trivy-filesystem.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          sarif_file: trivy-filesystem.sarif
